<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bree's Masquerade Invitation</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: white;

            text-align: center;

            background:

                radial-gradient(
                    circle at 50% 20%,
                    #4b1d46 0%,
                    #211022 35%,
                    #09070a 75%
                );

        }


        body::before {

            content: "";

            position: fixed;

            width: 700px;
            height: 700px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(115, 45, 105, 0.25),
                    transparent 70%
                );

            filter: blur(25px);

            animation:
                backgroundPulse
                6s
                ease-in-out
                infinite
                alternate;

        }


        @keyframes backgroundPulse {

            from {
                transform: scale(0.9);
                opacity: 0.6;
            }

            to {
                transform: scale(1.1);
                opacity: 1;
            }

        }


        .card {

            position: relative;

            width: 88%;
            max-width: 650px;

            padding:
                45px
                45px
                55px;

            background:

                linear-gradient(
                    145deg,
                    rgba(25, 15, 27, 0.98),
                    rgba(8, 6, 10, 0.99)
                );

            border:
                1px solid
                #c7a74c;

            border-radius: 8px;

            box-shadow:

                0 0 12px
                rgba(199, 167, 76, 0.25),

                0 0 50px
                rgba(80, 25, 80, 0.45),

                0 25px 70px
                rgba(0, 0, 0, 0.8);

            z-index: 5;

            animation:
                entrance
                1.2s
                ease;

        }


        @keyframes entrance {

            from {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        .card::before {

            content: "";

            position: absolute;

            top: 10px;
            bottom: 10px;
            left: 10px;
            right: 10px;

            border:
                1px solid
                rgba(199, 167, 76, 0.38);

            pointer-events: none;

        }


        .corner {

            position: absolute;

            color: #d6b85c;

            font-size: 28px;

            text-shadow:
                0 0 8px
                rgba(214, 184, 92, 0.5);

        }


        .top-left {
            top: 13px;
            left: 18px;
        }


        .top-right {
            top: 13px;
            right: 18px;
        }


        .bottom-left {
            bottom: 13px;
            left: 18px;
        }


        .bottom-right {
            bottom: 13px;
            right: 18px;
        }


        .mask {

            width: 300px;

            max-width: 80%;

            margin:
                -5px
                auto
                5px;

            padding: 5px;

            background:

                radial-gradient(
                    circle,
                    rgba(214, 184, 92, 0.10),
                    transparent 68%
                );

            animation:
                maskFloat
                3s
                ease-in-out
                infinite
                alternate;

        }


        .mask-image {

            width: 100%;

            height: auto;

            display: block;

            filter:

                brightness(1.25)

                drop-shadow(
                    0 0 2px
                    rgba(235, 207, 120, 0.65)
                )

                drop-shadow(
                    0 0 12px
                    rgba(212, 175, 55, 0.35)
                );

        }


        @keyframes maskFloat {

            from {
                transform:
                    translateY(0)
                    scale(1);
            }

            to {
                transform:
                    translateY(-5px)
                    scale(1.02);
            }

        }


        .eyebrow {

            color: #c7a74c;

            text-transform: uppercase;

            letter-spacing: 5px;

            font-size: 12px;

            margin:
                3px
                0
                20px;

        }


        h1 {

            color: #f0dfaa;

            font-weight: normal;

            font-size: 35px;

            line-height: 1.3;

            margin:
                10px
                0
                22px;

            text-shadow:
                0 0 12px
                rgba(199, 167, 76, 0.2);

        }


        .party-name {

            color: white;

            text-transform: uppercase;

            letter-spacing: 4px;

            font-size: 18px;

            margin-bottom: 12px;

        }


        .date {

            color: #cfb8dc;

            font-size: 19px;

            letter-spacing: 2px;

            margin-bottom: 30px;

        }


        .divider {

            width: 130px;

            height: 1px;

            margin:
                24px
                auto;

            background:

                linear-gradient(
                    to right,
                    transparent,
                    #c7a74c,
                    transparent
                );

        }


        .buttons {

            display: flex;

            justify-content: center;
            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

        }


        button {

            padding:
                15px
                30px;

            min-width: 135px;

            border-radius: 30px;

            font-family:
                Georgia,
                serif;

            font-size: 17px;

            cursor: pointer;

            transition:
                all
                0.3s
                ease;

            position: relative;

            z-index: 10;

        }


        .yes-button {

            color: #090709;

            font-weight: bold;

            border:
                1px solid
                #f0d880;

            background:

                linear-gradient(
                    135deg,
                    #f2dc8c,
                    #bd9140
                );

            box-shadow:
                0 0 12px
                rgba(205, 167, 65, 0.3);

        }


        .yes-button:hover {

            transform:
                scale(1.07);

            box-shadow:
                0 0 24px
                rgba(230, 190, 75, 0.7);

        }


        .no-button {

            color: #dcc8e6;

            background:
                rgba(
                    45,
                    23,
                    48,
                    0.72
                );

            border:
                1px solid
                rgba(
                    175,
                    130,
                    190,
                    0.5
                );

        }


        .no-button:hover {

            transform:
                scale(1.03);

            background:
                rgba(
                    65,
                    32,
                    70,
                    0.9
                );

        }


        .sparkle {

            position: fixed;

            color: #d4af37;

            pointer-events: none;

            text-shadow:
                0 0 10px
                rgba(212, 175, 55, 0.8);

            animation:
                twinkle
                2.5s
                ease-in-out
                infinite
                alternate;

        }


        .sparkle1 {
            top: 10%;
            left: 9%;
            font-size: 20px;
        }


        .sparkle2 {
            top: 21%;
            right: 10%;
            font-size: 27px;
            animation-delay: 0.6s;
        }


        .sparkle3 {
            bottom: 18%;
            left: 14%;
            font-size: 17px;
            animation-delay: 1.2s;
        }


        .sparkle4 {
            bottom: 12%;
            right: 16%;
            font-size: 25px;
            animation-delay: 0.3s;
        }


        .sparkle5 {
            top: 7%;
            right: 32%;
            font-size: 14px;
            animation-delay: 1.6s;
        }


        .sparkle6 {
            bottom: 7%;
            left: 37%;
            font-size: 19px;
            animation-delay: 0.9s;
        }


        @keyframes twinkle {

            from {
                opacity: 0.15;

                transform:
                    scale(0.7)
                    rotate(0deg);
            }

            to {
                opacity: 1;

                transform:
                    scale(1.25)
                    rotate(15deg);
            }

        }


        .accepted {

            animation:
                acceptance
                0.8s
                ease;

        }


        @keyframes acceptance {

            from {
                opacity: 0;

                transform:
                    scale(0.92);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }

        }


        .accepted h2 {

            color: white;

            font-weight: normal;

            font-size: 23px;

            line-height: 1.5;

            margin:
                22px
                0;

        }


        .final-line {

            color: #f0dfaa;

            font-size: 22px;

            line-height: 1.5;

            margin-top: 28px;

        }


        .confetti {

            position: fixed;

            top: -20px;

            z-index: 20;

            pointer-events: none;

            animation:
                fall
                linear
                forwards;

        }


        @keyframes fall {

            to {

                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;

            }

        }


        @media (max-width: 600px) {

            .card {

                width: 92%;

                padding:
                    35px
                    24px
                    45px;

            }


            .mask {
                width: 235px;
            }


            h1 {
                font-size: 27px;
            }


            .party-name {

                font-size: 15px;

                letter-spacing: 3px;

            }


            .date {
                font-size: 17px;
            }


            button {

                padding:
                    13px
                    22px;

                min-width: 120px;

            }


            .final-line {
                font-size: 19px;
            }

        }


    </style>

</head>


<body>


    <div class="sparkle sparkle1">✦</div>

    <div class="sparkle sparkle2">✧</div>

    <div class="sparkle sparkle3">✦</div>

    <div class="sparkle sparkle4">✧</div>

    <div class="sparkle sparkle5">✦</div>

    <div class="sparkle sparkle6">✧</div>



    <div class="card">


        <div class="corner top-left">
            ❦
        </div>


        <div class="corner top-right">
            ❦
        </div>


        <div class="corner bottom-left">
            ❦
        </div>


        <div class="corner bottom-right">
            ❦
        </div>



        <div class="mask">

            <img
                src="mask.png"
                alt="Ornate masquerade mask"
                class="mask-image"
            >

        </div>



        <div class="eyebrow">

            You Are Cordially Invited

        </div>



        <h1 id="question">

            Bree, will you be my dance partner?

        </h1>



        <div class="divider"></div>



        <div class="party-name">

            Christmas Masquerade

        </div>



        <div class="date">

            December 10th ✦

        </div>



        <div class="buttons">


            <button
                id="yesButton"
                class="yes-button">

                Yes, obviously 😏

            </button>



            <button
                id="noButton"
                class="no-button">

                No 🙄

            </button>


        </div>


    </div>



    <script>


        const yesButton =
            document.getElementById(
                "yesButton"
            );


        const noButton =
            document.getElementById(
                "noButton"
            );


        const question =
            document.getElementById(
                "question"
            );


        let noClicks = 0;


        let responseSent = false;



        const messages = [


            "Wow. Rude. Try again 😏",


            "Bree... I know you can make better choices than this 😂",


            "Are you seriously going to make me beg? 👀",


            "Careful... I'm starting to take this personally 😌",


            "You know you want to dance with me 💃",


            "The Yes button is getting hotter by the second 😏",


            "At this point you're just flirting with the No button 😂",


            "Fine. I'm taking away your options. You're welcome 😌"


        ];



        noButton.addEventListener(

            "click",

            function() {


                if (
                    noClicks <
                    messages.length
                ) {


                    question.innerHTML =

                        messages[
                            noClicks
                        ];

                }


                noClicks++;



                let noSize =

                    parseFloat(

                        window

                        .getComputedStyle(
                            noButton
                        )

                        .fontSize

                    );



                noButton.style.fontSize =

                    (
                        noSize *
                        0.82
                    )

                    + "px";



                noButton.style.padding =

                    Math.max(
                        4,
                        15 - noClicks
                    )

                    + "px "

                    +

                    Math.max(
                        7,
                        30 - (noClicks * 2)
                    )

                    + "px";



                let yesSize =

                    parseFloat(

                        window

                        .getComputedStyle(
                            yesButton
                        )

                        .fontSize

                    );



                yesButton.style.fontSize =

                    (
                        yesSize *
                        1.12
                    )

                    + "px";



                if (
                    noClicks ===
                    messages.length
                ) {


                    noButton.style.display =
                        "none";

                }


            }

        );



        yesButton.addEventListener(

            "click",

            function() {


                sendResponse();


                document

                    .querySelector(
                        ".card"
                    )

                    .innerHTML = `


                        <div
                            class="corner top-left">

                            ❦

                        </div>


                        <div
                            class="corner top-right">

                            ❦

                        </div>


                        <div
                            class="corner bottom-left">

                            ❦

                        </div>


                        <div
                            class="corner bottom-right">

                            ❦

                        </div>



                        <div class="accepted">



                            <div class="mask">


                                <img

                                    src="mask.png"

                                    alt="Ornate masquerade mask"

                                    class="mask-image"

                                >


                            </div>



                            <div class="eyebrow">

                                It's Official

                            </div>



                            <h1>

                                Knew you'd make the right choice 😏✨

                            </h1>



                            <div class="divider">

                            </div>



                            <h2>


                                You're officially my

                                dance partner for the


                                <br><br>


                                <span

                                    style="

                                        color:#d6b85c;

                                        letter-spacing:3px;

                                        text-transform:uppercase;

                                    ">


                                    Christmas Masquerade


                                </span>


                            </h2>



                            <div class="date">

                                December 10th ✦

                            </div>



                            <div class="final-line">


                                <strong>


                                    Now we just have to make sure

                                    we look hotter than everyone else.


                                </strong>


                            </div>



                        </div>


                `;



                makeConfetti();


            }

        );



        /*
            SEND BREE'S RESPONSE
            TO FORMSPREE
        */


        function sendResponse() {


            if (responseSent) {

                return;

            }


            responseSent = true;



            const formData =
                new FormData();



            formData.append(

                "Response",

                "Bree said YES 🎭✨"

            );



            formData.append(

                "Event",

                "Christmas Masquerade - December 10th"

            );



            formData.append(

                "No clicks before saying yes",

                noClicks

            );



            formData.append(

                "Time",

                new Date()
                    .toLocaleString()

            );



            fetch(

                "https://formspree.io/f/mqpebeva",

                {

                    method: "POST",

                    body: formData,

                    headers: {

                        "Accept":
                            "application/json"

                    }

                }

            )

            .then(

                function(response) {


                    if (response.ok) {


                        console.log(

                            "Response sent successfully!"

                        );


                    }

                    else {


                        console.log(

                            "There was a problem sending the response."

                        );


                    }


                }

            )

            .catch(

                function(error) {


                    console.log(

                        "Response could not be sent:",

                        error

                    );


                }

            );


        }



        function makeConfetti() {


            const symbols = [

                "✦",

                "✧",

                "★",

                "◆"

            ];



            for (

                let i = 0;

                i < 45;

                i++

            ) {



                const piece =

                    document.createElement(
                        "div"
                    );



                piece.classList.add(

                    "confetti"

                );



                piece.innerHTML =

                    symbols[

                        Math.floor(

                            Math.random()

                            *

                            symbols.length

                        )

                    ];



                piece.style.left =

                    Math.random()

                    * 100

                    + "vw";



                piece.style.color =

                    Math.random() > 0.5

                    ? "#d4af37"

                    : "#c5a3d6";



                piece.style.fontSize =

                    (

                        Math.random()

                        * 14

                        + 10

                    )

                    + "px";



                piece.style.animationDuration =

                    (

                        Math.random()

                        * 2

                        + 2

                    )

                    + "s";



                document.body

                    .appendChild(
                        piece
                    );



                setTimeout(

                    function() {

                        piece.remove();

                    },

                    4500

                );


            }


        }


    </script>


</body>

</html>
